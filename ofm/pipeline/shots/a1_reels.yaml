# a1 Reels: R01-R10 of BACKLOG_A.md (all in the LAUNCH SET, launch target 19 Oct 2026).
# "With her" POV first (cooking for you, date night in, gaming night together, morning coffee, getting ready).
# One 9:16 source still + one 5 or 10 s clip per Reel. SFW, fully clothed, AI label on every post.
#
# Step 1 (stills): shoot.py reads this file as a normal shot list (id, scene, outfit, pose, lighting, camera,
#   mood, look, aspect). Every still is aspect "9:16" so reels.py needs no crop.
#     python shoot.py --char a1 shots/a1_reels.yaml --variants 2          # 20 stills, ~ $0.54
#     python qc.py --char a1 out/a1/shoots/a1_reels --approve-to out/a1/approved
# Step 2 (video): the `reel:` block maps 1:1 onto reels.py arguments (shoot.py ignores it; it is still linted):
#     python reels.py --char a1 out/a1/approved/<id>_v0.jpg --motion "<reel.motion>" \
#                     --duration <reel.duration> --caption "<reel.hook>"          # $0.21 per 5 s, $0.42 per 10 s
#   reel.hook is burned in at 68% height by reels.py: max 26 characters so it fits one line at 1080 px.
#   reel.beats are timed text overlays added in the Instagram / TikTok editor (not burned in).
#   reel.caption is the post caption. reel.cta_ig never points to a link (Instagram is link-free for the first 30 days, to Wed 18 Nov). X carries the link, in a reply.
#   Audio: silent track; pick a trending sound from the platform library when posting.
# Identity: the bible states about 40, fine laugh lines, natural skin texture, silver streak at the front.
#   Each pose/motion repeats the streak; reject any still that reads under 35 at QC.
shots:
  - id: r01_cooking_for_you
    scene: warm compact London kitchen, dark green cabinets, pan of garlic and olive oil on the hob, two wine glasses and an unlabelled bottle on the wooden worktop
    outfit: black knit midi dress with a dark green cotton apron, gold hoop earrings
    pose: stirring the pan with a wooden spoon and looking up at the camera as if you just walked in, warm half-smile, silver streak at the front of her hair clearly visible
    lighting: warm kitchen light with steam glow
    camera: point-of-view from the kitchen doorway, phone at eye level, vertical framing
    mood: welcoming, in control, teasing
    look: phone
    aspect: "9:16"
    reel:
      concept: R01
      format: with-her POV (cooking)
      hook: "POV: I'm cooking for you"
      beats: ["Garlic in. Phone away.", "Red's breathing. So should you.", "You're on washing up."]
      caption: "You said you don't eat pasta. We'll see. 🍝"
      cta_ig: "Follow for next week's recipe"
      motion: "she stirs the pan, looks up into the camera and smiles warmly, then tilts her head towards the wine glasses, steam rising, gentle handheld movement, the silver streak at the front of her hair stays visible"
      duration: 5
