    outfit: black ribbed turtleneck jumper, gold hoop earrings
    pose: head-and-shoulders portrait, slight turn to her left so the silver streak falls clearly along the side of her face, confident closed-mouth half-smile
    lighting: soft side window light, gentle shadow on the far cheek
    camera: phone portrait at eye level, close crop
    mood: signature, self-assured
    look: phone
    aspect: "4:5"
    caption: "The streak stays."
  - id: p13_espresso_morning
