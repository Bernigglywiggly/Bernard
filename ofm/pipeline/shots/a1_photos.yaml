# a1 photo shot list: photos P01-P20 of BACKLOG_A.md = the LAUNCH SET photos (launch target 19 Oct 2026).
# SFW, fully clothed, AI label on every post. Instagram captions never point to a link (link-free for 30 days, to Wed 18 Nov).
# Identity: the bible states about 40, fine laugh lines, natural skin texture, silver streak at the front.
#   Generators pull faces younger: reject any image that reads under 35 at QC.
# Fields read by shoot.py: id, scene, outfit, pose, lighting, camera, mood, look (phone|35mm|studio), aspect.
# Extra field `caption` is ignored by shoot.py (it is still safety-linted) and is the post caption.
# The silver streak is in the character bible marks, so it is in every prompt. Never cover it: no hats, no hoods up.
# No real brands, logos, readable labels or named games/shows in any scene.
#
#   python shoot.py --char a1 shots/a1_photos.yaml --dry-run          # $0, prints requests
#   python shoot.py --char a1 shots/a1_photos.yaml --variants 2       # ~ $1.08 for 40 images (seedream flash)
#   python qc.py --char a1 out/a1/shoots/a1_photos --approve-to out/a1/approved
shots:
  - id: p01_friday_sofa
    scene: stylish London flat living room, deep green velvet sofa, warm table lamp, bookshelves and plants behind, glass of red wine on a side table
    outfit: black fine-knit midi dress with long sleeves, gold hoop earrings
    pose: curled up on the sofa with legs tucked to one side, holding the wine glass by the stem, confident closed-mouth half-smile at the camera
    lighting: warm tungsten lamp light with soft shadows, evening
    camera: friend's phone from the armchair opposite, eye level, slightly off-centre
    mood: Friday night calm, unbothered
    look: phone
    aspect: "4:5"
    caption: "Friday, sorted."
  - id: p02_ragu_counter
    scene: warm compact London kitchen, dark green cabinets, wooden worktop, a heavy pot simmering on the hob, garlic and tomatoes on a board, open shelves with jars
    outfit: black ribbed turtleneck jumper, high-waisted charcoal tailored trousers, gold hoop earrings
    pose: leaning back against the worktop holding a wooden spoon, head tilted, half-smile at the camera
    lighting: warm under-cabinet light plus soft window light from the left
    camera: phone at chest height from across the kitchen
    mood: in charge of dinner
    look: phone
    aspect: "4:5"
    caption: "Ragu's on. Nobody touch it."
  - id: p03_window_dusk
    scene: wide window seat with cushions overlooking generic London rooftops and chimney pots at dusk, a mug on the sill
    outfit: oversized cream cable-knit jumper, dark straight jeans, gold hoop earrings
    pose: sitting sideways on the window seat hugging her knees, turning her face from the window to the camera
    lighting: blue dusk from the window mixed with a warm lamp behind the camera
    camera: 35mm at seated eye level, candid framing
    mood: quiet hour, reflective
    look: 35mm
    aspect: "4:5"
    caption: "Rooftops and a quiet hour."
  - id: p04_hall_coat
    scene: narrow flat hallway with a round brass-framed mirror, coat hooks and a small console table with keys
    outfit: camel wool knee-length coat over a black knit dress, gold hoop earrings
    pose: standing at the mirror adjusting one earring, eyes meeting the camera in the mirror reflection
    lighting: soft warm hallway pendant light
    camera: phone from the end of the hallway, slight wide-angle
    mood: plan made, heading out
    look: phone
    aspect: "4:5"
    caption: "Coat on. Plan made."
  - id: p05_candle_glass
    scene: dark wooden dining table with two lit candles, a bottle with a plain unlabelled dark glass, bread on a board
    outfit: deep burgundy satin long-sleeve blouse, black tailored trousers, gold hoop earrings
    pose: seated, gently swirling red wine in a glass, looking at the camera over the rim with a knowing half-smile
    lighting: candlelight with warm falloff, dark background
    camera: 35mm across the table, shallow depth of field
    mood: intimate dinner, knowing
    look: 35mm
    aspect: "4:5"
    caption: "Ask me what's in the glass."
  - id: p06_coop_night
    scene: living room at night, TV glow off-frame, deep green velvet sofa with a knitted throw, a plain black game controller in her hands, wine glass on the side table
    outfit: soft grey cashmere crew-neck jumper, black straight trousers, gold hoop earrings
    pose: sitting forward on the sofa holding the controller, laughing mid-game and glancing at the camera
    lighting: cool blue screen glow on her face mixed with a warm lamp
    camera: phone from the side of the sofa, slightly low angle
    mood: competitive and having fun
    look: phone
    aspect: "4:5"
    caption: "Co-op night. I carry."
  - id: p07_record_shelf
    scene: low wooden record shelf full of vinyl with plain unprinted sleeves, a turntable on top, plants and a lamp
    outfit: black wrap midi dress with three-quarter sleeves, gold hoop earrings
    pose: crouched elegantly at the shelf flicking through records, looking up at the camera
    lighting: warm lamp light, soft evening shadows
    camera: phone from standing height looking slightly down
    mood: choosing the soundtrack
    look: phone
    aspect: "4:5"
    caption: "Pick one. I'll pour."
  - id: p08_balcony_night
    scene: small flat balcony with warm string lights and potted olive tree, blurred city lights beyond
    outfit: black leather jacket over a black knit midi dress, gold hoop earrings
    pose: leaning on the railing with a glass of red wine, looking back over her shoulder at the camera
    lighting: warm string lights and cool city night ambience
    camera: 35mm from the balcony door, candid
    mood: night air, relaxed confidence
    look: 35mm
    aspect: "4:5"
    caption: "Night air, red glass."
  - id: p09_basil_board
    scene: kitchen worktop with dark green cabinets, a chopping board of fresh basil, garlic cloves and a knife, pot steaming behind
    outfit: white linen shirt with sleeves rolled to the elbow, dark jeans, black linen apron, gold hoop earrings
    pose: chopping basil, looking up at the camera mid-laugh
    lighting: soft daylight from a window on the right
    camera: phone at worktop height, close medium shot
    mood: easy Sunday cooking
    look: phone
    aspect: "4:5"
    caption: "Basil, garlic, patience."
  - id: p10_mirror_dress
    scene: bedroom with a tall floor-standing mirror, linen bedding and a chair with a folded blanket in the background
    outfit: black fitted knit midi dress with a high crew neckline and long sleeves, gold hoop earrings, thin gold bracelet
    pose: single mirror selfie, ONE woman only and her single reflection, holding a completely blank matte black phone case with no logo, no emblem and no camera branding, phone held beside her face so her face stays fully visible, one hip slightly turned, half-smile
    lighting: warm evening lamp light
    camera: mirror selfie on the phone, the mirror shows exactly one person, no second face, no duplicate reflection
    mood: deciding between dinner out and the sofa
    look: phone
    aspect: "4:5"
    caption: "Dinner or sofa? Same dress."
  - id: p11_armchair_book
